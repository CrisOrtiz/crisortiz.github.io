  <style>
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;

      transition: opacity .5s ease, visibility .5s ease;
    }
    #app-loader.loader-hide { opacity: 0; visibility: hidden; }
    #app-loader img {
      width: 110px; height: 110px; object-fit: contain;
      animation: loader-bounce .9s cubic-bezier(.5, 0, .5, 1) infinite alternate;
    }
    #app-loader .loader-shadow {
      width: 70px; height: 10px; margin-top: 18px; border-radius: 50%;
      background: rgba(7, 136, 255, .45); filter: blur(3px);
      animation: loader-shadow .9s cubic-bezier(.5, 0, .5, 1) infinite alternate;
    }
    @keyframes loader-bounce {
      0% { transform: translateY(0) scale(1.08, .92); }
      15% { transform: translateY(-8px) scale(1, 1); }
      100% { transform: translateY(-70px) scale(.97, 1.03); }
    }
    @keyframes loader-shadow {
      0% { transform: scale(1); opacity: .9; }
      100% { transform: scale(.45); opacity: .3; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loader img, #app-loader .loader-shadow { animation: none; }
    }
  </style>
