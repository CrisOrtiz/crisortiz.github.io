<!-- Header -->
  <div class="header-top-fixed py-0 one-page-nav" [ngClass]="{'menu-open menu-open-desk' : sidebarOpen}">
    <div class="container">
        <!-- Brand -->
        <div class="logo">
            <a class="navbar-brand" href="javascript:">
                <img class="logo-light" title="" alt="" src="assets/img/logocris.png" style="max-width: 65%;">
            </a>
        </div>

        <div class="d-sm-flex d-lg-none align-items-center ms-2">
            <button class="px-btn lang-cta d-flex align-items-center px-3 py-0"
                    (click)="toggleLanguage()"
                    type="button"
                    [attr.aria-label]="'Switch language. Current: ' + currentLang + '. Switch to: ' + otherLang">
                <span class="d-sm-inline d-lg-none small me-2" style="font-size: xx-small;">Switch:</span>
                <img class="flag-icon" [src]="'assets/flags/' + otherLang + '.svg'" [alt]="otherLang + ' flag'" style="max-width: 20%;">
                <span class="d-sm-inline d-lg-none ms-2">{{ otherLang.toUpperCase() }}</span>
            </button>
        </div>
        <ul class="main-menu">
            <li>
                <a class="menu-item" [class.active]="activeSection === 'home'" href="#home" (click)="fullPageScroll('home')">
                    {{ content?.home }}
                </a>
            </li>
            <li>
                <a class="menu-item" [class.active]="activeSection === 'about'" href="#about" (click)="fullPageScroll('about')"> 
                    {{ content?.aboutme }}
                </a>
            </li>
            <li>
                <a class="menu-item" [class.active]="activeSection === 'project'" href="#project" (click)="fullPageScroll('project')">
                    {{ content?.education }}
                </a>
            </li>
            <li>
                <a class="menu-item" [class.active]="activeSection === 'services'" href="#services" (click)="fullPageScroll('services')">
                    {{ content?.xp }}
                </a>
            </li>
            <li>
                <a class="menu-item" [class.active]="activeSection === 'experience'" href="#experience" (click)="fullPageScroll('experience')">
                    {{ content?.experience }}
                </a>
            </li>
            <li>
                <a class="menu-item" [class.active]="activeSection === 'contact'" href="#contact" (click)="fullPageScroll('contact')">
                    {{ content?.contact }}
                </a>
            </li>
        </ul>
    
    <!-- Top Menu -->
        <div class="d-flex" (clickOutside)="onClickedOutside($event)">
            <button class="toggler-menu d-lg-none" [ngClass]="{'open': sidebarOpen}" (click)="toggleMenu()">
                <span></span>
            </button>
        </div>
    <!-- / -->
    <!-- language picker lg -->
   <div class="d-none d-lg-flex align-items-center ms-2">
        <button class="px-btn lang-cta d-flex align-items-center px-3 py-0"
                (click)="toggleLanguage()"
                type="button"
                [attr.aria-label]="'Switch language. Current: ' + currentLang + '. Switch to: ' + otherLang">
            <span class="d-none d-lg-inline small me-2" style="font-size: xx-small;">Switch:</span>
            <img class="flag-icon" [src]="'assets/flags/' + otherLang + '.svg'" [alt]="otherLang + ' flag'" style="max-width: 20%;">
            <span class="d-none d-lg-inline ms-2">{{ otherLang.toUpperCase() }}</span>
        </button>
    </div>
    <!-- / -->
</div>
