<div class="container" *ngIf="content as c">
    <div class="effect-1">
        <img src="assets/img/effect-1.svg" title="" alt="">
    </div>
    <div class="effect-2">
        <img src="assets/img/effect-2.svg" title="" alt="">
    </div>
    <div class="row align-items-center justify-content-center gy-5">
        <div class="col-lg-6 col-xl-5">
            <div class="about-banner text-center">
                <img src="assets/img/aboutme.png" title="" alt="">
            </div>
        </div>
        <div class="col-lg-6 col-xl-5 px-lg-5">
            <div class="about-text">
                <div class="section-heading">
                    <h6><span>{{ c.title }}</span></h6>                    
                </div>
                <p style="text-align: justify;">{{ c.p_1 }}</p>
                <p style="text-align: justify;">{{ c.p_2 }}</p>
                <p style="text-align: justify;">{{ c.p_3 }}</p>
                <p style="text-align: justify; font-weight: bolder;">{{ c.p_4 }}</p>
                <div class="review-box">
                    <div class="r-box">
                        <h3>{{ xpYears }}<span>+</span></h3>
                        <label>{{ c.xpYears }}</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
