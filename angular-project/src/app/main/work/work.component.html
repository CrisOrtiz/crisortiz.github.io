<div class="container">
    <div class="row justify-content-between">
        <div class="col-lg-6">
            <div class="section-heading">
                <h6><span>{{ heading().tag }}</span></h6>
                <h2>{{ heading().title }} <span>{{ heading().highlight }}</span></h2>
            </div>
        </div>
    </div>
    <owl-carousel-o [options]="customOptions">
        @for (p of items(); track p.name) {
            <ng-template carouselSlide>
            <div class="project-box h-100">
                <div class="project-head">
                    <i [class]="p.icon" aria-hidden="true"></i>
                </div>
                <div class="project-body">
                    <div class="text">
                        <h5>{{ p.name }}</h5>
                        <span>{{ p.context }}</span>
                    </div>
                    @if (p.url) {
                    <div class="link">
                        <a class="p-link" [href]="p.url" target="_blank" rel="noopener" [attr.aria-label]="codeLabel() + ': ' + p.name">
                            <i class="bi-github" aria-hidden="true"></i>
                        </a>
                    </div>
                    }
                </div>
                <p class="project-desc">{{ p.desc }}</p>
                <div class="project-tags">
                    @for (t of p.stack; track t) {
                    <span>{{ t }}</span>
                    }
                </div>
            </div>
            </ng-template>
        }
    </owl-carousel-o>
</div>
