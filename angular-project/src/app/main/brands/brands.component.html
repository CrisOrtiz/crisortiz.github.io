<div class="container">
    <owl-carousel-o [options]="customOptions2">
        @for (slide of slidesStore; track slide.src) {
            <ng-template carouselSlide>
            <div class="brand-slide">
                <img [src]="slide.src"
                    [alt]="slide.alt"
                    [title]="slide.title"
                    [style.width.px]="sizes()[slide.src]?.width"
                    [style.height.px]="sizes()[slide.src]?.height"
                    (load)="fitLogo(slide, $event)">
            </div>
            </ng-template>
        } @empty {
            <div class="text-center">No hay imágenes disponibles</div>
        }
    </owl-carousel-o>
</div>
