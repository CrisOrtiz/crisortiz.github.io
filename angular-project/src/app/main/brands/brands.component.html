<div class="container">
    <owl-carousel-o [options]="customOptions2">
        @for (slide of slidesStore; track slide.src) {
            <ng-template carouselSlide>
            <div class="p-3 text-center d-flex align-items-center justify-content-center" 
                style="height: 250px; width: 100%;">
                <img [src]="slide.src" 
                    [alt]="slide.alt" 
                    [title]="slide.title"
                    style="object-fit: contain; max-width: 100%; max-height: 100%;">
            </div>
            </ng-template>
        } @empty {
            <div class="text-center">No hay imágenes disponibles</div>
        }
    </owl-carousel-o>
</div>
