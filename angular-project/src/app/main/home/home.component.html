@let content = (homeContent$ | async);
<div class="container">
    <div class="row align-items-center">
        <div class="col-lg-6">
            <div class="hs-text-box">
                <h6><span>Cristhian Ortiz Mercado</span></h6>
                <h1 style="font-size: 50px;">{{ content?.greeting }}</h1>
                <h2><span style="font-size: 60px;" >{{ content?.headline }} <br>
                </span><span class="typed-element" style="font-size: 55px;"></span></h2>
                <p class="text" >{{ fill(content?.summary) }}</p>
                <div class="btn-bar d-flex align-items-sm-center flex-column flex-sm-row">
                    <span style="color: white;" class="px-lg-1">{{ content?.cta }}: </span>
                    <div class="social-icon ps-sm-4 pt-4 pt-sm-0 d-flex justify-content-center justify-content-sm-start">
                        <a class="linkedin" target="_blank" rel="noopener" aria-label="LinkedIn" href="https://www.linkedin.com/in/cristhian-edwin-ortiz-mercado/"><i class="bi-linkedin" aria-hidden="true"></i></a>
                        <a class="mail" aria-label="E-mail" href="mailto:cristhianortizmercado@gmail.com"><i class="bi-envelope-fill" aria-hidden="true"></i></a>
                        <a class="facebook" target="_blank" rel="noopener" aria-label="Facebook" href="https://www.facebook.com/cristhian.ortiz.mercado"><i class="bi-facebook" aria-hidden="true"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="hs-banner d-flex justify-content-center pb-3">
                <img src="assets/img/profile.webp" alt="Cristhian Ortiz Mercado, Full Stack Developer" width="500" height="500" fetchpriority="high" style="max-width: 70%; height: auto;">
            </div>
        </div>
    </div>
</div>
